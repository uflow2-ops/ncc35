name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Files
        run: |
          echo "Checking if required files exist..."
          ls -l js/config.template.js

      - name: Inject API Keys
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = Path("js/config.template.js").read_text(encoding="utf-8")
          secrets = {
              "NEIS_API_KEY": "선생님의_나이스_API_키",
              "WEATHER_KEY": "선생님의_기상청_API_키",
          }

          for name, placeholder in secrets.items():
              value = os.environ.get(name, "")
              if not value.strip():
                  raise SystemExit(f"Required GitHub Actions secret is empty: {name}")
              quoted_placeholder = f"'{placeholder}'"
              if quoted_placeholder not in config:
                  raise SystemExit(f"Configuration placeholder not found for {name}")
              config = config.replace(quoted_placeholder, json.dumps(value))

          if "선생님의_" in config:
              raise SystemExit("Unreplaced API key placeholder remains in config.js")

          Path("js/config.js").write_text(config, encoding="utf-8")
          print("API key configuration generated successfully.")
          PY

      - name: Verify Injection (Dry Run)
        run: |
          test -s js/config.js
          if grep -q "선생님의_" js/config.js; then
            echo "Unreplaced API key placeholder remains in config.js" >&2
            exit 1
          fi
          echo "API key configuration verified."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}